
name: DevSecOps Pipeline - Semana 07

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1: SAST CON SEMGREP
  # ==========================================
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Ejecutar Semgrep
        run: |
          mkdir -p reports

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            semgrep/semgrep:latest \
            semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --sarif \
            --output reports/semgrep.sarif

      - name: Publicar reporte Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif-report
          path: reports/semgrep.sarif
          if-no-files-found: warn

      - name: Quality Gate SAST
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open("reports/semgrep.sarif", encoding="utf-8") as f:
              data = json.load(f)

          findings = [
              result
              for run in data.get("runs", [])
              for result in run.get("results", [])
              if result.get("level") == "error"
          ]

          print(f"Hallazgos SAST bloqueantes: {len(findings)}")

          if findings:
              print("QUALITY GATE SAST: FAILED")
              sys.exit(1)

          print("QUALITY GATE SAST: SUCCESS")
          PY

  # ==========================================
  # JOB 2: GENERACION DE SBOM
  # ==========================================
  sbom:
    name: SBOM - CycloneDX
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Generar SBOM con Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Publicar SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          if-no-files-found: error

  # ==========================================
  # JOB 3: SCA CON DEPENDENCY-CHECK
  # ==========================================
  sca:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: |
          npm ci \
            --ignore-scripts \
            --no-audit \
            --legacy-peer-deps

      - name: Preparar directorios
        run: |
          mkdir -p reports
          mkdir -p dc-data

      - name: Ejecutar Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::Falta NVD_API_KEY"
            exit 2
          fi

          echo "Iniciando analisis SCA"

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$GITHUB_WORKSPACE/reports:/report" \
            owasp/dependency-check:latest \
            --project NodeGoat-Laboratorio \
            --scan /src \
            --format HTML \
            --format JSON \
            --out /report \
            --nvdApiKey "$NVD_API_KEY" \
            --failOnCVSS 7

      - name: Publicar reportes SCA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
          if-no-files-found: warn
