name: DevSecOps - SAST SCA SBOM
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sast:
    name: SAST Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Semgrep
        run: python -m pip install --upgrade semgrep
      - name: Analizar y generar JSON
        run: semgrep scan --config p/security-audit --json --output semgrep-results.json .
      - name: Publicar reporte SAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-json
          path: semgrep-results.json
          if-no-files-found: warn
      - name: Quality gate SAST (ERROR)
        run: |
          python - <<'PYCODE'
          import json, sys
          with open('semgrep-results.json', encoding='utf-8') as f:
              report = json.load(f)
          findings = [r for r in report.get('results', [])
                      if r.get('extra', {}).get('severity', '').upper() == 'ERROR']
          print(f'Hallazgos Semgrep ERROR: {len(findings)}')
          for r in findings[:20]:
              print(r.get('check_id'), r.get('path'), r.get('start', {}).get('line'))
          sys.exit(1 if findings else 0)
          PYCODE
  sbom:
    name: SBOM CycloneDX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar SBOM con Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          artifact-name: sbom-cyclonedx
      - name: Validar archivo SBOM
        run: |
          python - <<'PYCODE'
          import json
          with open('sbom.cyclonedx.json', encoding='utf-8') as f:
              sbom=json.load(f)
          assert sbom.get('bomFormat') == 'CycloneDX', 'Formato incorrecto'
          print('Componentes:', len(sbom.get('components', [])))
          PYCODE
  sca:
    name: SCA OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Ejecutar Dependency-Check (CVSS >= 7)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "ERROR: falta el secreto NVD_API_KEY"
            exit 2
          fi

          mkdir -p reports

          echo "Iniciando OWASP Dependency-Check"
          echo "Utilizando base de datos aislada del contenedor"

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$GITHUB_WORKSPACE/reports:/report" \
            owasp/dependency-check:latest \
            --project NodeGoat-Laboratorio \
            --scan /src \
            --format HTML \
            --format JSON \
            --out /report \
            --nvdApiKey "$NVD_API_KEY" \
            --failOnCVSS 7

      - name: Publicar reporte SCA incluso si falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: reports/
          if-no-files-found: warn
