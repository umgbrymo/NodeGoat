
name: DevSecOps Pipeline - Semana 07

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # =========================================
  # 1. ANALISIS SAST - SEMGREP
  # =========================================
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar reportes
        run: mkdir -p reports

      - name: Ejecutar Semgrep
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            semgrep/semgrep:latest \
            semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --sarif \
            --output reports/semgrep.sarif

      - name: Publicar reporte SAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif-report
          path: reports/semgrep.sarif
          if-no-files-found: warn

      - name: Quality Gate SAST
        run: |
          python3 - <<'PY'
          import json
          import sys

          with open("reports/semgrep.sarif",
                    encoding="utf-8") as f:
              data = json.load(f)

          findings = [
              result
              for run in data.get("runs", [])
              for result in run.get("results", [])
              if result.get("level") == "error"
          ]

          print("Hallazgos SAST bloqueantes:", len(findings))

          if findings:
              print("QUALITY GATE SAST: FAILED")
              sys.exit(1)

          print("QUALITY GATE SAST: SUCCESS")
          PY

  # =========================================
  # 2. GENERACION DE SBOM
  # =========================================
  sbom:
    name: SBOM - CycloneDX
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Generar SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false

      - name: Publicar SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          if-no-files-found: error

  # =========================================
  # 3. ANALISIS SCA - DEPENDENCY-CHECK
  # =========================================
  sca:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: |
          npm ci \
            --ignore-scripts \
            --no-audit \
            --legacy-peer-deps

      - name: Preparar directorios
        run: |
          mkdir -p reports
          mkdir -p dc-data
          chmod 777 dc-data
          chmod 777 reports

      # Solo se restauran caches creadas
      # tras una actualizacion exitosa.
      - name: Restaurar cache NVD
        uses: actions/cache/restore@v4
        with:
          path: dc-data
          key: nvd-h2-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-h2-v2-${{ runner.os }}-

      - name: Verificar directorio NVD
        run: |
          mkdir -p dc-data
          chmod -R a+rwX dc-data

          echo "Contenido del directorio NVD:"
          ls -lah dc-data

          echo "Verificando archivos de bloqueo"
          find dc-data -type f \
            \( -name '*.lock' -o -name '*.lock.db' \) \
            -print

          # No debe haber otro proceso
          # utilizando esta base en el runner.

      - name: Actualizar base de datos NVD
        id: nvd-update
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::Falta NVD_API_KEY"
            exit 2
          fi

          echo "Iniciando actualizacion NVD"

          docker run --rm \
            -v "$GITHUB_WORKSPACE/dc-data:/usr/share/dependency-check/data" \
            -e NVD_API_KEY \
            --entrypoint /bin/sh \
            owasp/dependency-check:latest \
            -c '
              exec /usr/share/dependency-check/bin/dependency-check.sh \
                --updateonly \
                --data /usr/share/dependency-check/data \
                --nvdApiKey "$NVD_API_KEY" \
                --nvdApiDelay 8000 \
                --nvdMaxRetryCount 5
            '

      - name: Guardar cache NVD
        if: steps.nvd-update.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: dc-data
          key: nvd-h2-v2-${{ runner.os }}-${{ github.run_id }}

      - name: Ejecutar Dependency-Check
        run: |
          echo "Ejecutando analisis SCA"

          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$GITHUB_WORKSPACE/reports:/report" \
            -v "$GITHUB_WORKSPACE/dc-data:/usr/share/dependency-check/data" \
            owasp/dependency-check:latest \
            --project NodeGoat-Laboratorio \
            --scan /src \
            --data /usr/share/dependency-check/data \
            --noupdate \
            --format HTML \
            --format JSON \
            --out /report \
            --failOnCVSS 7

      - name: Publicar reportes SCA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
          if-no-files-found: warn
